<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer</title>
<style>
:root{
  --bg:#f3f5f2; --fg:#1d2a26; --muted:#7b8a84; --accent:#1f6f5c; --line:#d5ddd8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121816; --fg:#e6eee9; --muted:#8a9b94; --accent:#5fc4a8; --line:#2b3733;}
}
:root[data-theme="dark"]{--bg:#121816; --fg:#e6eee9; --muted:#8a9b94; --accent:#5fc4a8; --line:#2b3733;}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center}
main{text-align:center;padding:24px;width:100%;max-width:420px}
#display{font-size:clamp(64px,22vw,112px);font-weight:200;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1;margin:0 0 8px}
#display.done{color:var(--accent)}
.bar{height:2px;background:var(--line);margin:20px 0 28px;border-radius:2px;overflow:hidden}
#fill{height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .25s linear}
.presets,.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.presets{margin-bottom:28px}
button{font:inherit;color:var(--fg);background:none;border:1px solid var(--line);border-radius:999px;
  padding:9px 18px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.presets button{font-size:14px;color:var(--muted);padding:6px 14px}
.presets button.on{color:var(--fg);border-color:var(--accent)}
#go{background:var(--accent);border-color:var(--accent);color:var(--bg);min-width:110px}
#go:hover{filter:brightness(1.08)}
.adj{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:22px;color:var(--muted);font-size:14px}
.adj button{padding:4px 12px}
</style>
</head>
<body>
<main>
  <h1 id="display" aria-live="off">05:00</h1>
  <div class="bar"><div id="fill"></div></div>
  <div class="presets" id="presets">
    <button data-m="1">1 min</button>
    <button data-m="5" class="on">5 min</button>
    <button data-m="10">10 min</button>
    <button data-m="25">25 min</button>
  </div>
  <div class="adj">
    <button id="minus" aria-label="Subtract one minute">−1</button>
    <span>adjust minutes</span>
    <button id="plus" aria-label="Add one minute">+1</button>
  </div>
  <div class="controls">
    <button id="go">Start</button>
    <button id="reset">Reset</button>
  </div>
</main>
<script>
(function(){
  var total=300, left=300, end=0, tick=null;
  var disp=document.getElementById('display'), fill=document.getElementById('fill'),
      go=document.getElementById('go');
  function fmt(s){
    var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
    var p=function(n){return String(n).padStart(2,'0')};
    return (h?h+':':'')+p(m)+':'+p(x);
  }
  function draw(){
    var s=Math.ceil(left);
    disp.textContent=fmt(s);
    document.title=(tick?fmt(s)+' · ':'')+'Timer';
    fill.style.transform='scaleX('+(total?left/total:0)+')';
  }
  function stop(){clearInterval(tick);tick=null;go.textContent=left>0&&left<total?'Resume':'Start';}
  function beep(){
    try{
      var c=new (window.AudioContext||window.webkitAudioContext)();
      [0,.3,.6].forEach(function(t){
        var o=c.createOscillator(),g=c.createGain();
        o.frequency.value=880;o.connect(g);g.connect(c.destination);
        g.gain.setValueAtTime(.15,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);
        o.start(c.currentTime+t);o.stop(c.currentTime+t+.22);
      });
    }catch(e){}
  }
  function run(){
    if(left<=0)left=total;
    end=Date.now()+left*1000;
    disp.classList.remove('done');
    go.textContent='Pause';
    tick=setInterval(function(){
      left=Math.max(0,(end-Date.now())/1000);
      draw();
      if(left<=0){stop();go.textContent='Start';disp.classList.add('done');left=0;draw();beep();}
    },100);
  }
  function setMinutes(m){
    m=Math.max(1,Math.min(180,m));
    clearInterval(tick);tick=null;
    total=left=m*60;
    disp.classList.remove('done');go.textContent='Start';draw();
    document.querySelectorAll('#presets button').forEach(function(b){b.classList.toggle('on',+b.dataset.m===m)});
  }
  go.onclick=function(){tick?stop():run();};
  document.getElementById('reset').onclick=function(){setMinutes(Math.round(total/60));};
  document.getElementById('plus').onclick=function(){setMinutes(Math.round(total/60)+1);};
  document.getElementById('minus').onclick=function(){setMinutes(Math.round(total/60)-1);};
  document.getElementById('presets').onclick=function(e){
    if(e.target.dataset.m)setMinutes(+e.target.dataset.m);
  };
  draw();
})();
</script>
</body>
</html>
